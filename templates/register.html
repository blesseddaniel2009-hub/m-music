{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block body %}<h1>Create your account</h1><form method="post" class="stack narrow"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Full name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Phone<input name="phone"></label>
<label>I want to<select name="account_type"><option value="user">Book services and shop</option><option value="artist">Offer my services as an artist</option></select></label>
<label>Password (8+ characters)<input type="password" name="password" minlength="8" required></label>
<button class="btn">Create account</button></form>
<p>You can switch later: users can <a href="{{ url_for('become_provider') }}">offer their services</a> at any time.</p>{% endblock %}
