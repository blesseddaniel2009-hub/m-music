{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block body %}<h1>Log in</h1><form method="post" class="stack narrow"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn">Log in</button><p>New here? <a href="{{ url_for('register') }}">Create an account</a></p></form>{% endblock %}
